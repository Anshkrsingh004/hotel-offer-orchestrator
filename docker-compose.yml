# Hotel Offer Orchestrator — full local stack.
#
# Services:
#   postgresql   persistence for the Temporal server
#   temporal     Temporal server (auto-setup: provisions schema + default ns)
#   temporal-ui  Temporal Web UI (http://localhost:8080)
#   redis        de-duplicated listing store + price-range filtering
#   api          Express API + mock suppliers + /health
#   worker       Temporal worker running workflows & activities

services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.25.2}
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233"
    healthcheck:
      # The Temporal CLI ships in the auto-setup image; this gates dependants
      # on the frontend actually being healthy (schema provisioned, ns ready).
      # Temporal binds to the container's network IP (not loopback), so the
      # self-check targets the service name rather than 127.0.0.1.
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.34.0}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # Build this image once; the worker reuses the same tag below.
    image: hotel-offer-orchestrator:latest
    command: node dist/api/server.js
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - API_PORT=3000
      # /health probes suppliers hosted in this same process.
      - SUPPLIER_BASE_URL=http://localhost:3000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-orchestrator
      - REDIS_URL=redis://redis:6379
      - REDIS_TTL_SECONDS=300
    ports:
      - "3000:3000"
    healthcheck:
      # Uses the service's own /health endpoint (both suppliers are in-process).
      # Node's global fetch avoids needing curl/wget in the slim image.
      test: ["CMD", "node", "--no-warnings", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    # Reuses the image built by the api service — no second build.
    image: hotel-offer-orchestrator:latest
    command: node dist/temporal/worker.js
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      # Activities call the mock suppliers hosted by the api service.
      - SUPPLIER_BASE_URL=http://api:3000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-orchestrator
      - REDIS_URL=redis://redis:6379
      - REDIS_TTL_SECONDS=300

volumes:
  temporal-pg:
